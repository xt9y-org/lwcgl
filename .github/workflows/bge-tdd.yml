name: bge-migration-tdd

on:
  push:
    branches:
      - bge-logical-window-size

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev xvfb pkg-config
      - name: Build logical-size regression target
        run: make clean build/tests/runtime-smoke
      - name: Run logical-size regression target
        run: xvfb-run -a ./build/tests/runtime-smoke
      - name: Build shared library
        run: make build/liblwcgl-2.9.3.so
