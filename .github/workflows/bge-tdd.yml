name: bge-migration-tdd

on:
  push:
    branches:
      - bge-logical-window-size

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libglu1-mesa-dev xvfb pkg-config
      - name: Build and test
        run: xvfb-run -a make clean check
